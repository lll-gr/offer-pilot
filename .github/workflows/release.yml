name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 需要完整历史以生成版本间 changelog

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: |
          npm run typecheck
          npm test

      - name: Sync package version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Regenerate icons from logo.svg
        run: npm run icons

      - name: Build & zip extension
        run: npm run zip
        # wxt zip 产出即最终命名：.output/offer-pilot-{version}-chrome.zip

      - name: Generate changelog (中文)
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -1 || true)
          {
            echo "## 更新内容"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log --no-merges --format="- %s" "${PREV_TAG}..${TAG}"
            else
              git log --no-merges --format="- %s" "${TAG}"
            fi
            echo ""
            echo "## 安装方式"
            echo ""
            echo "1. 下载 \`offer-pilot-${TAG}-chrome.zip\` 并解压"
            echo "2. 打开 \`chrome://extensions\`，开启「开发者模式」"
            echo "3. 点击「加载已解压的扩展程序」，选择解压目录"
            if [ -n "$PREV_TAG" ]; then
              echo ""
              echo "**完整对比**：[\`${PREV_TAG}...${TAG}\`](${{ github.server_url }}/${{ github.repository }}/compare/${PREV_TAG}...${TAG})"
            fi
          } > CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: .output/offer-pilot-*.zip
          body_path: CHANGELOG.md
