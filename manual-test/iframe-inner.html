<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>iframe inner form</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 12px;
      }
      label {
        font-size: 13px;
        font-weight: 600;
      }
      input {
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 14px;
        box-sizing: border-box;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="field">
      <label for="iframe-email">iframe 内邮箱</label>
      <input id="iframe-email" name="email" type="email" autocomplete="email" />
    </div>
    <div class="field">
      <label for="iframe-school">iframe 内学校</label>
      <input id="iframe-school" name="school" type="text" />
    </div>
  </body>
</html>
